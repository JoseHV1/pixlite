<div class="min-h-screen flex flex-col items-center justify-center bg-background text-on-background font-sans px-gutter py-section-gap">
  <div class="text-center mb-stack-lg max-w-2xl">
    <h1 class="text-display-lg text-primary mb-stack-sm">PixLite</h1>
    <p class="text-body-lg text-on-surface-variant">
      Comparación de las 3 propuestas de diseño en styles/. Elige una para verla completa.
    </p>
  </div>

  <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-stack-md">
    @for (theme of themes; track theme.path) {
      <a
        [routerLink]="theme.path"
        class="flex flex-col gap-stack-sm rounded-xl border border-outline-variant bg-surface-container-lowest p-stack-md hover:border-primary transition-colors duration-200"
      >
        <h2 class="text-headline-md text-on-surface">{{ theme.name }}</h2>
        <p class="text-body-md text-on-surface-variant flex-grow">{{ theme.description }}</p>
        <span class="text-label-sm font-bold text-primary">Ver diseño →</span>
      </a>
    }
  </div>
</div>
