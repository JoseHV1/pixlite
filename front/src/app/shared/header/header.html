<header class="w-full h-16 shrink-0 bg-background border-b border-outline-variant/40">
  <div class="flex h-full w-full max-w-(--spacing-container-max) mx-auto items-center justify-between px-gutter">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1">compress</span>
      <span class="text-headline-md font-bold text-primary">PixLite</span>
    </div>

    <nav class="hidden md:flex items-center gap-8">
      <a href="#" class="text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200">Tools</a>
      <a href="#" class="text-body-md text-primary border-b-2 border-primary pb-1 transition-colors duration-200">Compress</a>
      <a href="#" class="text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200">Convert</a>
    </nav>

    <div class="flex items-center gap-4">
      <button aria-label="Toggle dark mode" class="text-on-surface-variant hover:text-primary transition-colors duration-200 focus:outline-none">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
      <button aria-label="Help" class="text-on-surface-variant hover:text-primary transition-colors duration-200 focus:outline-none">
        <span class="material-symbols-outlined">help</span>
      </button>
    </div>
  </div>
</header>
