<div
  class="group relative w-full h-full min-h-64 flex flex-col items-center justify-center text-center p-12 overflow-hidden cursor-pointer rounded-xl border-2 border-dashed bg-surface transition-all duration-300 ease-in-out hover:border-primary hover:bg-primary/5"
  [class]="isDragOver() ? 'border-primary bg-primary/5' : 'border-outline-variant'"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <div class="z-10 flex flex-col items-center gap-4">
    <span
      class="material-symbols-outlined text-6xl text-primary transition-transform duration-300 group-hover:scale-110"
      style="font-variation-settings: 'FILL' 0"
      >cloud_upload</span
    >
    <div>
      <h2 class="text-headline-md text-on-surface mb-2">{{ heading() }}</h2>
      <p class="text-body-md text-on-surface-variant">{{ hint() }}</p>
    </div>
    <p class="text-label-sm text-outline uppercase">{{ caption() }}</p>
  </div>
  <input
    type="file"
    multiple
    accept="image/jpeg,image/png,image/webp"
    aria-label="Upload images"
    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
    (change)="onInputChange($event)"
  />
</div>
