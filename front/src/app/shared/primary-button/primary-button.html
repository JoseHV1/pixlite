<button
  type="button"
  class="min-h-14 px-8 py-4 rounded-xl flex items-center justify-center gap-2 bg-primary text-on-primary text-headline-md shadow-action transition-all duration-200 hover:bg-primary-container active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:bg-primary disabled:opacity-80 disabled:cursor-wait disabled:active:scale-100"
  [class.w-full]="fullWidth()"
  [disabled]="loading()"
  [attr.aria-busy]="loading()"
>
  @if (loading()) {
    <app-spinner [size]="22" [label]="loadingLabel()" />
    <span>{{ loadingLabel() }}</span>
  } @else {
    <span class="material-symbols-outlined">{{ icon() }}</span>
    <span>{{ label() }}</span>
  }
</button>
