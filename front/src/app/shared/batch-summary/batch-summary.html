<div
  class="w-full rounded-xl border border-primary/20 bg-primary/5 p-stack-md flex flex-wrap items-center justify-between gap-stack-sm animate-fade-in-up"
>
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1">savings</span>
    <div>
      <p class="text-headline-md text-primary font-bold">{{ displayPercent() }}% {{ isSmaller() ? 'smaller' : 'bigger' }}</p>
      <p class="text-label-sm text-on-surface-variant">{{ summary().doneCount }} image(s) optimized</p>
    </div>
  </div>
  <div class="flex items-center gap-stack-md">
    <div class="text-body-md text-on-surface-variant font-medium">
      {{ formattedOriginal() }} <span class="text-primary">→</span> {{ formattedCompressed() }}
    </div>
    <button
      type="button"
      (click)="downloadAll.emit()"
      [disabled]="zipping()"
      [attr.aria-busy]="zipping()"
      class="flex items-center gap-2 text-label-sm font-bold text-on-primary bg-primary hover:bg-primary-container transition-colors px-4 py-2 rounded-lg disabled:bg-primary disabled:opacity-80 disabled:cursor-wait"
    >
      @if (zipping()) {
        <app-spinner [size]="16" label="Creating .zip" />
        Creating .zip...
      } @else {
        <span class="material-symbols-outlined text-base">folder_zip</span>
        Download All (.zip)
      }
    </button>
  </div>

  @if (error()) {
    <p class="w-full text-label-sm text-error">{{ error() }}</p>
  }
</div>
