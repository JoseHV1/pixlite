services:
  back:
    build:
      context: ./back
    environment:
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped

  front:
    build:
      context: ./front
    ports:
      - "127.0.0.1:3003:80"
    restart: unless-stopped
